# devstudio.tmux.conf
# Private tmux configuration for DevStudio

# --- General behavior ---

# Enable mouse support
set -g mouse on

# tmux status bar
set -g status on
set -g status-left " GQREDUX "
set -g status-right ""
set -g status-style bg=colour235,fg=colour250
set -g window-status-current-style bg=colour39,fg=colour0

# Window names
set -g window-status-format "  #W  "
set -g window-status-current-format "[ #W ]"

# Start indexing windows at 1
set -g base-index 1

# Start panes at 1
set -g pane-base-index 1

# Allow applications to receive true color
set -g default-terminal "tmux-256color"


# --- Key handling ---


# Easier navigation
# Direct window switching
bind-key -n F1 select-window -t 1
bind-key -n F2 select-window -t 2
bind-key -n F3 select-window -t 3
bind-key -n F4 select-window -t 4
bind-key -n F5 select-window -t 5

# Reload this config
bind-key r source-file ./devtmux.conf


# --- Window behavior ---

# Automatically rename windows based on application name
set -g automatic-rename on

# Keep the current window focused when switching
set -g renumber-windows on


# --- Mouse-friendly behavior ---

# Click pane to focus
bind-key -n MouseDown1Pane select-pane -t =


# --- Colors ---

set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour39